<!DOCTYPE html>

<html>

<head>
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
</head>

<body>
  <header class="header">
    <img class="header__img" src="./eisenhower-matrix.jpg" alt="eisenhower-matrix">
    <a class="header__link" href="https://goal-life.com/page/method/matrix-eisenhower">
      Want more details?
    </a>
  </header>
  <main class="main">
    <section class="add">
      <label class="label-new-task" for="new-task">
        <h3 class="section-title">Add Item</h3>
      </label>
      <div class="task-row-wrapper">
        <input id="new-task" class="task input input_bordered" type="text">
        <button class="btn">Add</button>
      </div>
    </section>
    <section class="todo">
      <h3 class="section-title">Todo</h3>
      <ul class="list list_incomplete" id="incompleteTasks">
        <li class="list-item">
          <input type="checkbox" class="input input_checkbox">
          <label class="task">Pay Bills</label>
          <input type="text" class="task input input_hidden">
          <button class="btn btn_edit">Edit</button>
          <button class="btn btn_delete">
            <img class="btn__img" src="./remove.svg" alt="remove icon">
          </button>
        </li>
        <li class="list-item list-item_edit editMode">
          <input type="checkbox" class="input input_checkbox">
          <label class="task">Go Shopping</label>
          <input type="text" value="Go Shopping" class="task input input_hidden">
          <button class="btn btn_edit">Save</button>
          <button class="btn btn_delete">
            <img class="btn__img" src="./remove.svg" alt="remove icon">
          </button>
        </li>
      </ul>
    </section>
    <section class="completed">
      <h3 class="section-title">Completed</h3>
      <ul class="list list_completed" id="completed-tasks">
        <li class="list-item">
          <input type="checkbox" checked class="input input_checkbox">
          <label class="task">See the Doctor</label>
          <input type="text" class="task input input_hidden">
          <button class="btn btn_edit">Edit</button>
          <button class="btn btn_delete">
            <img class="btn__img" src="./remove.svg" alt="remove icon">
          </button>
        </li>
      </ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>

</html>
